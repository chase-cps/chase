[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "chase-cps"
version = "0.4.0"
description = "CHASE: Contract-based Heterogeneous Analysis and Systems Exploration"
readme = "python/README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Yifeng Xiao", email = "yifengx@berkeley.edu" }]
requires-python = ">=3.10"
keywords = ["contracts", "assume-guarantee", "LTL", "formal methods",
            "cyber-physical systems", "requirements", "model checking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest"]
# z3 refines the predicate abstraction of real comparisons (chase_cps.predicates)
reals = ["z3-solver>=4.12"]
# Yosys (compiled to WebAssembly) reads RTL as state machines (chase_cps.rtl)
rtl = ["yowasp-yosys"]

[project.scripts]
chase-cps = "chase_cps.cli:main"

[project.urls]
Homepage = "https://chase-cps.github.io"
Documentation = "https://chase-cps.github.io/api/"
Repository = "https://github.com/chase-cps/chase"
Issues = "https://github.com/chase-cps/chase/issues"
Changelog = "https://github.com/chase-cps/chase/blob/master/CHANGELOG.md"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["python/chase_cps"]
build-dir = "build/{wheel_tag}"
sdist.exclude = ["legacy", ".github", "build", "install"]

[tool.scikit-build.cmake.define]
CHASE_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
