name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, also installs the back ends from their sites

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev pybind11-dev uuid-dev libboost-dev libxml2 libedit2
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "CMAKE_EXTRA=-Dpybind11_DIR=/usr/lib/cmake/pybind11" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pybind11 python@3.13 boost libxml2 gmp libedit
          echo "PYTHON=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"
          echo "CMAKE_EXTRA=-DCMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/chase
          -DPython_EXECUTABLE=$PYTHON
          -DCHASE_BUILD_TESTS=ON
          $CMAKE_EXTRA

      - name: Build and install
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the installation
        run: |
          export PATH=$RUNNER_TEMP/chase/chase/bin:$PATH
          export PYTHONPATH=$RUNNER_TEMP/chase/chase/lib
          cd demos
          dsl_tool -i DATE18/template_0_realizable.txt -o $RUNNER_TEMP/t -b gr1c
          test -s $RUNNER_TEMP/t.spc
          (cd DATE21 && logics_tool -i specs/robotic_arm.ltl -o $RUNNER_TEMP/d21 -c solution.script)
          test -s $RUNNER_TEMP/d21/system.smv
          $PYTHON -c "import pychase, pychase_backends, pychase_DSL, pychase_logicsLang"

      - name: Cache the back ends
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.chase
          key: chase-tools-${{ runner.os }}-${{ hashFiles('python/chase_cps/tools.py') }}

      - name: Install the back ends with chase-cps install
        run: |
          export CHASE_INSTALL_DIR=$RUNNER_TEMP/chase PYTHONPATH=python
          if [ ! -x ~/.chase/bin/nuXmv ]; then
            $PYTHON -m chase_cps install nuxmv --accept-license
          fi
          if [ ! -e ~/.chase/bin/slugs ]; then $PYTHON -m chase_cps install slugs; fi
          $PYTHON -m chase_cps doctor || true

      - name: Python tests (with nuXmv and slugs)
        run: |
          $PYTHON -m pip install pytest z3-solver || $PYTHON -m pip install --break-system-packages pytest z3-solver
          CHASE_INSTALL_DIR=$RUNNER_TEMP/chase PYTHONPATH=python $PYTHON -m pytest -q python/tests

  # The CHASE objects are freed by their owner (the contract owns its
  # formulas, a formula its operands). AddressSanitizer finds an object that
  # is freed twice or used after it was freed.
  asan:
    runs-on: ubuntu-24.04
    env:
      # Errors only: the tests and the programs keep some objects until they
      # end, which LeakSanitizer would report.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev pybind11-dev uuid-dev libboost-dev libxml2 libedit2
          $(command -v python3) -m pip install --break-system-packages pytest z3-solver

      - name: Build and install
        env:
          # The modules add -fPIC to the flags of the Release build only.
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer -g -fPIC
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer -g -fPIC
          LDFLAGS: -fsanitize=address
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/chase \
            -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python3) \
            -DCHASE_BUILD_TESTS=ON -Dpybind11_DIR=/usr/lib/cmake/pybind11
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Cache the back ends
        uses: actions/cache@v4
        with:
          path: ~/.chase
          key: chase-tools-asan-${{ hashFiles('python/chase_cps/tools.py') }}

      - name: Install the back ends with chase-cps install
        run: |
          # chase_cps loads the modules built with AddressSanitizer. libstdc++
          # is preloaded too, so that AddressSanitizer finds __cxa_throw (the
          # parser throws on syntax errors).
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)"
          export CHASE_INSTALL_DIR=$RUNNER_TEMP/chase PYTHONPATH=python
          if [ ! -x ~/.chase/bin/nuXmv ]; then python3 -m chase_cps install nuxmv --accept-license; fi
          if [ ! -e ~/.chase/bin/slugs ]; then python3 -m chase_cps install slugs; fi

      - name: Console scripts of the demos
        run: |
          export PATH=$RUNNER_TEMP/chase/chase/bin:$PATH
          cd demos
          for f in DATE21/specs/template_0_unrealizable.txt DATE18/template_0_realizable.txt FDL2024/dsl_factory_realizable.txt; do
            dsl_tool -i $f -o $RUNNER_TEMP/dsl -b gr1c
            dsl_tool -i $f -o $RUNNER_TEMP/dsl
          done
          (cd DATE21 && logics_tool -i specs/robotic_arm.ltl -o $RUNNER_TEMP/d21 -c solution.script)
          (cd RoboticJoints && logics_tool -i specs.ltl -o $RUNNER_TEMP/rj -c verification.chase &&
                               logics_tool -i specs.ltl -o $RUNNER_TEMP/rj -c synthesis.chase)
          (cd CPSWeek22 && logics_tool -i specs.ltl -o $RUNNER_TEMP/c -c verification.chase &&
                           logics_tool -i single_model.ltl -o $RUNNER_TEMP/c -c singlemodel.chase)
          (cd Charger && logics_tool -i charger.ltl -o $RUNNER_TEMP/chg -c charger.chase)
          (cd LiftPlusCruise && logics_tool -i lpc.ltl -o $RUNNER_TEMP/lpc -c lpc.chase)

      - name: Python tests
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)"
          # The reports go to files: pytest would hide those of a test that crashes.
          export ASAN_OPTIONS=detect_leaks=0:log_path=$RUNNER_TEMP/asan
          CHASE_INSTALL_DIR=$RUNNER_TEMP/chase PYTHONPATH=python \
            python3 -m pytest -q -x -rA --tb=short python/tests || status=$?
          cat $RUNNER_TEMP/asan.* 2>/dev/null || true
          exit ${status:-0}

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the Docker image
        run: docker build --build-arg ACCEPT_NUXMV_LICENSE=yes -t chase .

      - name: Run the demos
        run: docker run --rm chase /opt/chase/tests/demo-suite.sh

      - name: Python tests (with nuXmv and slugs)
        run: docker run --rm chase python3 -m pytest -q /opt/chase/python/tests
